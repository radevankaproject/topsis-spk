# Nginx URL Rewrite untuk TOPSIS
# Salin isi ini ke: aaPanel -> Website -> topsis.radevankaproject.web.id -> URL rewrite

# Dashboard / Home
rewrite ^/home$ /index.php last;

# Login / Logout
rewrite ^/login$ /app/views/login.php last;
rewrite ^/out$ /app/views/logout.php last;

# Halaman Users [Add, Edit]
rewrite ^/users$ /index.php?m=users&r=users last;
rewrite ^/users/add$ /index.php?m=users&r=add last;
rewrite ^/users/edit/([0-9]+)$ /index.php?m=users&r=edit&id=$1 last;

# Users Actions
rewrite ^/users/actionAdd$ /app/controllers/UsersControllers.php?action=add last;
rewrite ^/users/actionEdit/([0-9]+)$ /app/controllers/UsersControllers.php?action=edit&id=$1 last;
rewrite ^/users/delete/([0-9]+)$ /app/controllers/UsersControllers.php?action=delete&id=$1 last;

# Halaman Kriteria
rewrite ^/criteria$ /index.php?m=criteria&r=criteria last;
rewrite ^/criteria/add$ /index.php?m=criteria&r=add last;
rewrite ^/criteria/edit/([a-zA-Z0-9_\-]+)$ /index.php?m=criteria&r=edit&id=$1 last;

# Criterias Actions
rewrite ^/criteria/actionAdd$ /app/controllers/CriteriasControllers.php?action=add last;
rewrite ^/criteria/actionEdit/([a-zA-Z0-9_\-]+)$ /app/controllers/CriteriasControllers.php?action=edit&id=$1 last;
rewrite ^/criteria/delete/([a-zA-Z0-9_\-]+)$ /app/controllers/CriteriasControllers.php?action=delete&id=$1 last;

# Alternatif
rewrite ^/alternative/add$ /index.php?m=alternative&r=add last;
rewrite ^/alternative/save$ /app/controllers/AlternativeControllers.php?action=save last;
rewrite ^/alternative$ /index.php?m=alternative&r=list last;

# TOPSIS Results
rewrite ^/topsis/results$ /index.php?m=topsis&r=results last;
rewrite ^/fullResults$ /index.php?m=topsis&r=fullResults last;

# System Health / Core Sync Endpoint
rewrite ^/api/core-sync$ /api/core-sync.php last;
